    constraints:
      expect_skills:
        - management-autopr-review
    graders:
      - type: output-matches
        name: "API-version overlap detected"
        config:
          pattern: "\\[MGMT-API-VERSION-OVERLAP\\]"
      - type: output-matches
        name: "API-version overlap is blocking"
        config:
          pattern: "(?s)### Blocking.*\\[MGMT-API-VERSION-OVERLAP\\]"
      - type: prompt
    rubric:
      - The branch contains output from two API-version generations, so MGMT-API-VERSION-OVERLAP is required.
      - The CHANGELOG is evidence of generation overlap, not the defect itself.
      - MGMT-API-VERSION-OVERLAP must appear under Blocking.

  - name: missing-release-plan
    environment:
      skills:
        - ".."
      files:
        - src: "fixtures/positive-missing-release-plan-pr.json"
          dest: "github-responses/get-pull-request.json"
        - src: "fixtures/positive-missing-release-plan-java.diff"
          dest: "pr-diff/026-NetworkLinks.java.diff"
    prompt: >
      Use the management-autopr-review skill to review the synthetic PR.
