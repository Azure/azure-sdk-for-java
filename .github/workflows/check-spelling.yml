name: Check Spelling

on:
  pull_request:
    # Keep this list aligned with eng/pipelines/pullrequest.yml.
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - restapi*
      - pipelinev3*

permissions:
  contents: read

jobs:
  check-spelling:
    name: Check Spelling
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eng/common/spelling/package-lock.json

      - name: Check spelling
        shell: pwsh
        run: >
          ./eng/common/scripts/check-spelling-in-changed-files.ps1
          -CspellConfigPath .vscode/cspell.json
          -ExitWithError
          -SourceCommittish HEAD
          -TargetCommittish HEAD^
