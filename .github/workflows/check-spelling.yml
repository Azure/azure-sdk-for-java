name: Check Spelling

on:
  pull_request:
    # Keep this list aligned with eng/pipelines/pullrequest.yml.
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*

permissions:
  contents: read

jobs:
  check-spelling:
    name: Check Spelling
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: eng/common/spelling/package-lock.json

      - name: Check spelling
        shell: pwsh
        run: >
          ./eng/common/scripts/check-spelling-in-changed-files.ps1
          -CspellConfigPath .vscode/cspell.json
          -ExitWithError
          -SourceCommittish HEAD
          -TargetCommittish HEAD^
