name: Issue Investigation Handoff

on:
  workflow_run:
    workflows: ["Agentic Triage"]
    types: [completed]

permissions: {}

concurrency:
  group: issue-investigation-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  handoff:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'issues' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Checkout trusted handoff implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Set up pinned threat-result parser
        uses: github/gh-aw-actions/setup@423b3dc04bbf1b1797194a4a75aa5cf5d0d4f5b3 # v0.87.1
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Dispatch eligible applied triage result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_ACTIONS_DIR: ${{ runner.temp }}/gh-aw/actions
        run: python3 .github/scripts/issue_investigation_handoff.py
