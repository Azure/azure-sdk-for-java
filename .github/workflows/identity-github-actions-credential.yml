name: Identity GitHub Actions credential

on:
  push:
    branches:
      - vcolin7-github-actions-credential
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: com.azure:azure-identity
            pom: sdk/identity/azure-identity/pom.xml
          - package: com.azure.v2:azure-identity
            pom: sdk/identity-v2/azure-identity/pom.xml
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_IDENTITY_GITHUB_ACTIONS_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_IDENTITY_GITHUB_ACTIONS_CLIENT_ID }}
      AZURE_TEST_MODE: LIVE
      RUN_GITHUB_ACTIONS_CREDENTIAL_LIVE_TESTS: 'true'
      SDK_COORDINATES: ${{ matrix.package }}
      SDK_POM: ${{ matrix.pom }}
    steps:
      - name: Check test identity configuration
        shell: bash
        run: |
          if [[ -z "$AZURE_TENANT_ID" || -z "$AZURE_CLIENT_ID" ]]; then
            echo "::error::Set AZURE_IDENTITY_GITHUB_ACTIONS_TENANT_ID and AZURE_IDENTITY_GITHUB_ACTIONS_CLIENT_ID repository variables."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the selected SDK and its dependencies
        shell: bash
        run: >
          mvn -B -ntp -f pom.xml -pl "$SDK_COORDINATES" -am
          install -DskipTests -Djacoco.skip=true -Dgpg.skip=true

      - name: Authenticate through GitHub OIDC and Microsoft Entra
        shell: bash
        run: >
          mvn -B -ntp -f "$SDK_POM"
          test -Dtest=GitHubActionsCredentialLiveTest
