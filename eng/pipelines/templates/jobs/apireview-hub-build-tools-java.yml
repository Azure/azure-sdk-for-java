parameters:
  - name: languageRepoResource
    type: string
  - name: toolsRef
    type: string
  - name: languageToolsRef
    type: string
  - name: poolName
    type: string
    default: azsdk-pool
  - name: imageOverride
    type: string
    default: ubuntu-24.04

jobs:
  - template: /eng/common/pipelines/templates/jobs/apireview-hub-build-tools-base.yml
    parameters:
      languageRepoResource: ${{ parameters.languageRepoResource }}
      toolsRef: ${{ parameters.toolsRef }}
      languageToolsRef: ${{ parameters.languageToolsRef }}
      poolName: ${{ parameters.poolName }}
      imageOverride: ${{ parameters.imageOverride }}
      stepList:
        - task: PowerShell@2
          displayName: Stage Java API review tools
          inputs:
            targetType: filePath
            filePath: $(LanguageToolsSourceDirectory)/eng/scripts/Stage-ApiReviewTools.ps1
            arguments: >-
              -SourceDirectory "$(LanguageToolsSourceDirectory)"
              -BinOutputDirectory "$(BinOutputDirectory)"
            pwsh: true
