parameters:
  - name: CheckoutRecordings
    type: boolean
    default: false
  - name: OS
    type: string
    default: $(OSVmImage)
  - name: ServiceDirectory
    type: string
    default: 'not-specified' # Set a default that breaks in obvious ways.
  - name: ExcludePaths
    type: object
    default: []

steps:
  # Skip sparse checkout for the `azure-sdk-for-<lang>-pr` private mirrored repositories
  # as we require the GitHub service connection to be loaded.
  - ${{ if not(contains(variables['Build.DefinitionName'], 'java-pr')) }}:
    - checkout: self
      path: s
      fetchFilter: tree:0
      fetchDepth: 0
      fetchTags: false
      ${{ if parameters.CheckoutRecordings }}:
        sparseCheckoutPatterns: /* !/*/ /eng /.config **/*.xml **/ci*.yml
      ${{ else }}:
        sparseCheckoutPatterns: /* !/*/ /eng /.config **/*.xml **/ci*.yml !sdk/**/test-recordings !sdk/**/session-records
      env:
        AGENT_SOURCE_CHECKOUT_QUIET: 'true'

  - task: UsePythonVersion@0
    displayName: 'Use Python $(PythonVersion)'
    inputs:
      versionSpec: $(PythonVersion)

  - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml
    parameters:
      AgentImage: ${{ parameters.OS }}

  - task: PythonScript@0
    displayName: 'Set versions for source build'
    inputs:
      scriptPath: 'eng/versioning/set_versions.py'
      arguments: '--prep-source-testing'
    condition: and(succeeded(), eq(variables['TestFromSource'], 'true'))

  - task: PythonScript@0
    displayName: 'Update versions for source build'
    inputs:
      scriptPath: 'eng/versioning/update_versions.py'
      arguments: '--skip-readme'
    condition: and(succeeded(), eq(variables['TestFromSource'], 'true'))

  - template: /eng/pipelines/templates/steps/generate-project-list-and-cache-maven-repository.yml
    parameters:
      JobType: 'test'
      ServiceDirectory: ${{parameters.ServiceDirectory}}
      ExcludePaths: ${{parameters.ExcludePaths}}

  - task: PythonScript@0
    displayName: 'Generate build POM and directories for sparse checkout'
    inputs:
      scriptPath: 'eng/scripts/generate_scopred_pom.py'
      arguments: '--artifacts-list $(ArtifactsList) --from-source $(TestFromSource) --additional-modules-list $(AdditionalModulesList)'
      workingDirectory: '$(System.DefaultWorkingDirectory)'

  # Skip sparse checkout for the `azure-sdk-for-<lang>-pr` private mirrored repositories
  # as we require the GitHub service connection to be loaded.
  - ${{ if not(contains(variables['Build.DefinitionName'], 'java-pr')) }}:
    - template: /eng/pipelines/templates/steps/sparse-checkout-repo-initialized.yml
      parameters:
        Paths: $(SparseCheckoutDirectories)
