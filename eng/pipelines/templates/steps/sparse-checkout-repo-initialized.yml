parameters:
  - name: Paths
    type: object
    default: []

steps:
  - ${{ if not(contains(variables['Build.DefinitionName'], 'java-pr')) }}:
    - task: PowerShell@2
      displayName: 'Prepare computed sparse checkout paths'
      inputs:
        pwsh: true
        filePath: eng/pipelines/scripts/Invoke-Sparse-Checkout.ps1
        arguments: >-
          -PathsJson $env:SPARSE_CHECKOUT_PATHS
          -ChangesPath "$(Agent.TempDirectory)/sparse-checkout-changes.patch"
        workingDirectory: $(Build.SourcesDirectory)
      env:
        SPARSE_CHECKOUT_PATHS: ${{ convertToJson(parameters.Paths) }}

    - checkout: self
      displayName: 'Checkout computed source paths'
      path: s
      clean: false
      fetchFilter: tree:0
      fetchDepth: 0
      fetchTags: false
      env:
        AGENT_SOURCE_CHECKOUT_QUIET: 'true'
      sparseCheckoutPatterns: $(SparseCheckoutPatterns)
      condition: and(succeeded(), eq(variables['SparseCheckoutRequired'], 'true'))

    - task: PowerShell@2
      displayName: 'Restore generated source-build changes'
      condition: and(succeeded(), eq(variables['SparseCheckoutRequired'], 'true'))
      inputs:
        pwsh: true
        filePath: eng/pipelines/scripts/Invoke-Sparse-Checkout.ps1
        arguments: >-
          -Restore
          -ChangesPath "$(Agent.TempDirectory)/sparse-checkout-changes.patch"
          -SourceVersion "$(SparseCheckoutSourceVersion)"
        workingDirectory: $(Build.SourcesDirectory)
