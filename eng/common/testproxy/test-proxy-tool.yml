# This template sets variable PROXY_PID to be used for shutdown later.
parameters:
  rootFolder: '$(Build.SourcesDirectory)'
  runProxy: true
  targetVersion: ''
  templateRoot: '$(Build.SourcesDirectory)'
  condition: true
  proxyUrl: 'http://localhost:5000'

steps:
  - pwsh: |
        ${{ parameters.templateRoot }}/eng/common/scripts/trust-proxy-certificate.ps1
    displayName: 'Language Specific Certificate Trust'
    condition: and(succeeded(), ${{ parameters.condition }})

  - task: PowerShell@2
    displayName: 'Override proxy version if necessary'
    condition: and(succeeded(), ${{ parameters.condition }}, ne('${{ parameters.targetVersion }}', ''))
    inputs:
      targetType: filePath
      filePath: '${{ parameters.templateRoot }}/eng/common/testproxy/scripts/override-proxy-version.ps1'
      arguments: '-TargetVersion "${{ parameters.targetVersion }}"'
      pwsh: true

  - task: PowerShell@2
    inputs:
      targetType: filePath
      filePath: '${{ parameters.templateRoot }}/eng/common/pipelines/scripts/Install-TestProxy.ps1'
      arguments: >
        -TemplateRoot "${{ parameters.templateRoot }}"
        -BinariesDirectory $(Build.BinariesDirectory)
        -RunProxy ${{ parameters.runProxy }}
      pwsh: true
    displayName: "Install and configure test-proxy"
    condition: and(succeeded(), ${{ parameters.condition }})

  - ${{ if eq(parameters.runProxy, 'true') }}:
    - task: PowerShell@2
      inputs:
        targetType: filePath
        filePath: '${{ parameters.templateRoot }}/eng/common/pipelines/scripts/Start-TestProxy.ps1'
        arguments: >
          -RootFolder "${{ parameters.rootFolder }}"
          -ProxyUrl ${{ parameters.proxyUrl }}
          -BinariesDirectory $(Build.BinariesDirectory)
        pwsh: true
      displayName: 'Run test-proxy'
      condition: and(succeeded(), ${{ parameters.condition }})
      env:
        DOTNET_ROLL_FORWARD: 'Major'

    - task: PowerShell@2
      inputs:
        targetType: filePath
        filePath: '${{ parameters.templateRoot }}/eng/common/pipelines/scripts/Test-TestProxyIsAlive.ps1'
        arguments: >
          -ProxyUrl ${{ parameters.proxyUrl }}
        pwsh: true
      displayName: "Test Proxy IsAlive"
      condition: and(succeeded(), ${{ parameters.condition }})
