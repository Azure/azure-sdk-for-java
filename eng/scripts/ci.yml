# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
      - eng/versioning/project_overrides.py
      - eng/versioning/update_versions.py
      - eng/versioning/utils.py
      - eng/versioning/supported_external_dependency_versions.json
      - eng/pipelines/scripts/Invoke-Sparse-Checkout.ps1
      - eng/pipelines/templates/steps/sparse-checkout-repo-initialized.yml
    exclude:
      - eng/scripts/typespec

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
      - eng/versioning/project_overrides.py
      - eng/versioning/update_versions.py
      - eng/versioning/utils.py
      - eng/versioning/supported_external_dependency_versions.json
      - eng/pipelines/scripts/Invoke-Sparse-Checkout.ps1
      - eng/pipelines/templates/steps/sparse-checkout-repo-initialized.yml

extends:
  template: /eng/common/pipelines/templates/stages/archetype-sdk-tool-pwsh.yml
  parameters:
    TargetDirectory: eng/scripts/
    TargetTags: 'UnitTest'
    PreTestSteps:
      - task: UsePythonVersion@0
        displayName: 'Use Python $(PythonVersion)'
        inputs:
          versionSpec: $(PythonVersion)
      - script: python -m unittest discover -s eng/scripts -p "test_*.py" -v
        displayName: Test scoped POM generation and project dependency overrides
        env:
          AZSDK_RUN_MAVEN_OVERRIDE_TESTS: 'true'
