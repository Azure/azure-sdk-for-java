# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
      - eng/java-doc-classifier/*
      - eng/pipelines/templates/jobs/ci.yml
      - eng/pipelines/scripts/Invoke-Sparse-Checkout.ps1
      - eng/pipelines/templates/steps/sparse-checkout-repo-initialized.yml
    exclude:
      - eng/scripts/typespec

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
      - eng/java-doc-classifier/*
      - eng/pipelines/templates/jobs/ci.yml
      - eng/pipelines/scripts/Invoke-Sparse-Checkout.ps1
      - eng/pipelines/templates/steps/sparse-checkout-repo-initialized.yml

extends:
  template: /eng/common/pipelines/templates/stages/archetype-sdk-tool-pwsh.yml
  parameters:
    TargetDirectory: eng/scripts/
    TargetTags: 'UnitTest'
    PreTestSteps:
      - task: Maven@4
        displayName: Build and test Java documentation classifier
        inputs:
          mavenPomFile: eng/java-doc-classifier/pom.xml
          goals: 'package'
          options: '--batch-mode --no-transfer-progress'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.17'
          publishJUnitResults: true
          testResultsFiles: 'eng/java-doc-classifier/target/surefire-reports/TEST-*.xml'
