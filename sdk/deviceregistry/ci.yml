# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/deviceregistry/ci.yml
      - sdk/deviceregistry/azure-resourcemanager-deviceregistry/
    exclude:
      - sdk/deviceregistry/pom.xml
      - sdk/deviceregistry/azure-resourcemanager-deviceregistry/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/deviceregistry/ci.yml
      - sdk/deviceregistry/azure-resourcemanager-deviceregistry/
    exclude:
      - sdk/deviceregistry/pom.xml
      - sdk/deviceregistry/azure-resourcemanager-deviceregistry/pom.xml

parameters:
  - name: release_azureresourcemanagerdeviceregistry
    displayName: azure-resourcemanager-deviceregistry
    type: boolean
    default: false
  - name: release_azureiotdeviceregistrysoftwareupdate
    displayName: azure-iot-deviceregistry-softwareupdate
    type: boolean
    default: true

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: deviceregistry
    Artifacts:
      - name: azure-resourcemanager-deviceregistry
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagerdeviceregistry
        releaseInBatch: ${{ parameters.release_azureresourcemanagerdeviceregistry }}
      - name: azure-iot-deviceregistry-softwareupdate
        groupId: com.azure
        safeName: azureiotdeviceregistrysoftwareupdate
        releaseInBatch: ${{ parameters.release_azureiotdeviceregistrysoftwareupdate }}
