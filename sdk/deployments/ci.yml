# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/deployments/ci.yml
      - sdk/deployments/azure-resourcemanager-deployments/
    exclude:
      - sdk/deployments/pom.xml
      - sdk/deployments/azure-resourcemanager-deployments/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/deployments/ci.yml
      - sdk/deployments/azure-resourcemanager-deployments/
    exclude:
      - sdk/deployments/pom.xml
      - sdk/deployments/azure-resourcemanager-deployments/pom.xml

parameters:
  - name: release_azureresourcemanagerdeployments
    displayName: azure-resourcemanager-deployments
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: deployments
    Artifacts:
      - name: azure-resourcemanager-deployments
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagerdeployments
        releaseInBatch: ${{ parameters.release_azureresourcemanagerdeployments }}
