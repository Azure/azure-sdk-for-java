# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/koreaiartemis/ci.yml
      - sdk/koreaiartemis/azure-resourcemanager-koreaiartemis/
    exclude:
      - sdk/koreaiartemis/pom.xml
      - sdk/koreaiartemis/azure-resourcemanager-koreaiartemis/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/koreaiartemis/ci.yml
      - sdk/koreaiartemis/azure-resourcemanager-koreaiartemis/
    exclude:
      - sdk/koreaiartemis/pom.xml
      - sdk/koreaiartemis/azure-resourcemanager-koreaiartemis/pom.xml

parameters:
  - name: release_azureresourcemanagerkoreaiartemis
    displayName: azure-resourcemanager-koreaiartemis
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: koreaiartemis
    Artifacts:
      - name: azure-resourcemanager-koreaiartemis
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagerkoreaiartemis
        releaseInBatch: ${{ parameters.release_azureresourcemanagerkoreaiartemis }}
