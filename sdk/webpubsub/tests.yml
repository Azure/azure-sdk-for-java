trigger: none

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-tests.yml
  parameters:
    ServiceDirectory: webpubsub
    TestResourceDirectories:
      - webpubsub
      - webpubsub/azure-messaging-webpubsub-chat
    Artifacts:
      - name: azure-messaging-webpubsub
        groupId: com.azure
        safeName: azuremessagingwebpubsub
      - name: azure-messaging-webpubsub-client
        groupId: com.azure
        safeName: azuremessagingwebpubsubclient
      - name: azure-messaging-webpubsub-chat
        groupId: com.azure
        safeName: azuremessagingwebpubsubchat
    TimeoutInMinutes: 60
    EnvVars:
      AZURE_LOG_LEVEL: 2
      AZURE_SUBSCRIPTION_ID: $(WEBPUBSUB_SUBSCRIPTION_ID)
