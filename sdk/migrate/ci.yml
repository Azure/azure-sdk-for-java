# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/migrate/ci.yml
      - sdk/migrate/azure-resourcemanager-migrate-containerappsassessments/
    exclude:
      - sdk/migrate/pom.xml
      - sdk/migrate/azure-resourcemanager-migrate-containerappsassessments/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/migrate/ci.yml
      - sdk/migrate/azure-resourcemanager-migrate-containerappsassessments/
    exclude:
      - sdk/migrate/pom.xml
      - sdk/migrate/azure-resourcemanager-migrate-containerappsassessments/pom.xml

parameters:
  - name: release_azureresourcemanagermigratecontainerappsassessments
    displayName: azure-resourcemanager-migrate-containerappsassessments
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: migrate
    Artifacts:
      - name: azure-resourcemanager-migrate-containerappsassessments
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagermigratecontainerappsassessments
        releaseInBatch: ${{ parameters.release_azureresourcemanagermigratecontainerappsassessments }}
