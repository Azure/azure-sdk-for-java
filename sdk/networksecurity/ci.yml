# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/networksecurity/ci.yml
      - sdk/networksecurity/azure-resourcemanager-networksecurity/
    exclude:
      - sdk/networksecurity/pom.xml
      - sdk/networksecurity/azure-resourcemanager-networksecurity/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/networksecurity/ci.yml
      - sdk/networksecurity/azure-resourcemanager-networksecurity/
    exclude:
      - sdk/networksecurity/pom.xml
      - sdk/networksecurity/azure-resourcemanager-networksecurity/pom.xml

parameters:
  - name: release_azureresourcemanagernetworksecurity
    displayName: azure-resourcemanager-networksecurity
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: networksecurity
    Artifacts:
      - name: azure-resourcemanager-networksecurity
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagernetworksecurity
        releaseInBatch: ${{ parameters.release_azureresourcemanagernetworksecurity }}
