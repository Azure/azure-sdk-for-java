# Scheduled janitor for the long lived shared Cosmos test accounts.
#
# The in-process janitor (CosmosTestResourceJanitor) and the always-run post steps in tests.yml cover
# the cases where the test JVM or the job gets a chance to clean up. A test run only ever deletes its
# own resources; reclaiming other runs' orphans is this pipeline's job, where the age threshold cannot
# race an in-flight job. This pipeline is the backstop for
# the cases where they do not - a cancelled job, an agent that dies, or a stage that hits its timeout -
# by sweeping test databases older than any plausible in-flight run.
#
# Only databases whose id follows the test naming convention
# (RxJava.SDKTest.SharedDatabase_<timestamp>_<runId>_<random>) are deleted, so hand created fixtures on
# these accounts are never touched. OlderThanHours must stay comfortably above the longest test stage
# timeout (currently 210 minutes) so that a running job's databases are never deleted.
#
# The pipeline definition must be linked to the same variable group as the Cosmos live test pipeline so
# that the account endpoint/key variables below resolve.

trigger: none
pr: none

schedules:
  - cron: '0 */6 * * *'
    displayName: 'Every six hours'
    branches:
      include:
        - main
    always: true

parameters:
  - name: OlderThanHours
    type: number
    default: 8
  - name: Accounts
    type: object
    default:
      - Name: ThinClient
        HostVariable: thinclient-test-endpoint
        KeyVariable: thinclient-test-key
      - Name: ThinClientCanaryMultiRegion
        HostVariable: thin-client-canary-multi-region-session-endpoint
        KeyVariable: thin-client-canary-multi-region-session-key
      - Name: ThinClientCanaryMultiWriter
        HostVariable: thin-client-canary-multi-writer-session-endpoint
        KeyVariable: thin-client-canary-multi-writer-session-key
      - Name: Gsi
        HostVariable: gsi-pipeline-uri
        KeyVariable: gsi-pipeline-key

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    UseOfficial: false
    stages:
      - stage: CleanupCosmosTestAccounts
        displayName: 'Clean up stale Cosmos test resources'
        variables:
          # Declared here rather than linked on the pipeline definition (as sdk/cosmos/tests.yml does) so
          # that creating the pipeline needs no extra configuration - the group only has to be authorized
          # for it. Supplies the account endpoint/key pairs referenced below.
          - group: 'Test Secrets for Cosmos Live Tests - user administered'
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml
        jobs:
          - job: Cleanup
            timeoutInMinutes: 90
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - template: /eng/pipelines/templates/steps/maven-authenticate.yml

              - task: Maven@4
                displayName: 'Build azure-cosmos-tests'
                inputs:
                  mavenPomFile: pom.xml
                  goals: 'install'
                  # DefaultOptions pins maven.repo.local so the install here and the exec:java sweep
                  # below resolve against the same local repository.
                  options: >-
                    $(DefaultOptions) -DskipTests $(DefaultSkipOptions) -Djacoco.skip=true
                    -pl com.azure:azure-cosmos-tests -am
                  mavenOptions: '$(MemoryOptions) $(LoggingOptions)'
                  javaHomeOption: 'JDKVersion'
                  jdkVersionOption: $(JavaTestVersion)
                  jdkArchitectureOption: 'x64'
                  publishJUnitResults: false

              - ${{ each account in parameters.Accounts }}:
                - task: Maven@4
                  displayName: 'Sweep ${{ account.Name }}'
                  # One unreachable account must not stop the others from being swept. An account whose
                  # sweep fails or is incomplete surfaces as SucceededWithIssues on this step - the stage
                  # stays green, so check the step annotations rather than the stage result.
                  condition: always()
                  continueOnError: true
                  inputs:
                    mavenPomFile: sdk/cosmos/azure-cosmos-tests/pom.xml
                    goals: 'exec:java'
                    options: >-
                      $(DefaultOptions)
                      -Dexec.args="--account-host $(${{ account.HostVariable }})
                      --account-key $(${{ account.KeyVariable }})
                      --older-than ${{ parameters.OlderThanHours }}"
                    mavenOptions: '$(MemoryOptions) $(LoggingOptions)'
                    javaHomeOption: 'JDKVersion'
                    jdkVersionOption: $(JavaTestVersion)
                    jdkArchitectureOption: 'x64'
                    publishJUnitResults: false
