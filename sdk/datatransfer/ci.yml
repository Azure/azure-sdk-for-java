# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/datatransfer/ci.yml
      - sdk/datatransfer/azure-resourcemanager-datatransfer/
    exclude:
      - sdk/datatransfer/pom.xml
      - sdk/datatransfer/azure-resourcemanager-datatransfer/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/datatransfer/ci.yml
      - sdk/datatransfer/azure-resourcemanager-datatransfer/
    exclude:
      - sdk/datatransfer/pom.xml
      - sdk/datatransfer/azure-resourcemanager-datatransfer/pom.xml

parameters:
  - name: release_azureresourcemanagerdatatransfer
    displayName: azure-resourcemanager-datatransfer
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: datatransfer
    Artifacts:
      - name: azure-resourcemanager-datatransfer
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagerdatatransfer
        releaseInBatch: ${{ parameters.release_azureresourcemanagerdatatransfer }}
