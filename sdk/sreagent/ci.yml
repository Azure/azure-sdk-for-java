# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/sreagent/ci.yml
      - sdk/sreagent/azure-resourcemanager-appservice-sreagent/
    exclude:
      - sdk/sreagent/pom.xml
      - sdk/sreagent/azure-resourcemanager-appservice-sreagent/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/sreagent/ci.yml
      - sdk/sreagent/azure-resourcemanager-appservice-sreagent/
    exclude:
      - sdk/sreagent/pom.xml
      - sdk/sreagent/azure-resourcemanager-appservice-sreagent/pom.xml

parameters:
  - name: release_azureresourcemanagerappservicesreagent
    displayName: azure-resourcemanager-appservice-sreagent
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: sreagent
    Artifacts:
      - name: azure-resourcemanager-appservice-sreagent
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagerappservicesreagent
        releaseInBatch: ${{ parameters.release_azureresourcemanagerappservicesreagent }}
