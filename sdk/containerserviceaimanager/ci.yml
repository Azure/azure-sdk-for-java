# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/containerserviceaimanager/ci.yml
      - sdk/containerserviceaimanager/azure-resourcemanager-containerserviceaimanager/
    exclude:
      - sdk/containerserviceaimanager/pom.xml
      - sdk/containerserviceaimanager/azure-resourcemanager-containerserviceaimanager/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/containerserviceaimanager/ci.yml
      - sdk/containerserviceaimanager/azure-resourcemanager-containerserviceaimanager/
    exclude:
      - sdk/containerserviceaimanager/pom.xml
      - sdk/containerserviceaimanager/azure-resourcemanager-containerserviceaimanager/pom.xml

parameters:
  - name: release_azureresourcemanagercontainerserviceaimanager
    displayName: azure-resourcemanager-containerserviceaimanager
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: containerserviceaimanager
    Artifacts:
      - name: azure-resourcemanager-containerserviceaimanager
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanagercontainerserviceaimanager
        releaseInBatch: ${{ parameters.release_azureresourcemanagercontainerserviceaimanager }}
