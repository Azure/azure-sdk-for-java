# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/anyscale/ci.yml
      - sdk/anyscale/azure-resourcemanager-anyscale/
    exclude:
      - sdk/anyscale/pom.xml
      - sdk/anyscale/azure-resourcemanager-anyscale/pom.xml

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - sdk/anyscale/ci.yml
      - sdk/anyscale/azure-resourcemanager-anyscale/
    exclude:
      - sdk/anyscale/pom.xml
      - sdk/anyscale/azure-resourcemanager-anyscale/pom.xml

parameters:
  - name: release_azureresourcemanageranyscale
    displayName: azure-resourcemanager-anyscale
    type: boolean
    default: false

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: anyscale
    Artifacts:
      - name: azure-resourcemanager-anyscale
        groupId: com.azure.resourcemanager
        safeName: azureresourcemanageranyscale
        releaseInBatch: ${{ parameters.release_azureresourcemanageranyscale }}
