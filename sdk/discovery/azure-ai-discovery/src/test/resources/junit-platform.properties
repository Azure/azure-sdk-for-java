# Global default timeout for all @Test methods. Long-running Discovery operations (especially KnowledgeBase
# indexing/search/delete) can be slow, and a service-side issue can cause an LRO to never reach a terminal state.
# A generous per-test timeout ensures a hung test fails fast instead of blocking the entire suite.
#
# separate_thread mode runs each test on its own thread so a blocked call (e.g. a reactive block()/blockLast()
# waiting on a non-terminating poll) can be interrupted when the timeout elapses.
junit.jupiter.execution.timeout.testable.method.default = 10 m
junit.jupiter.execution.timeout.thread.mode.default = separate_thread
