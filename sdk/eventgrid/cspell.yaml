# Spell-check overrides for this SDK group.
# Inherits the global config at the repo root.
#
# Add words that only appear in this folder here, in alphabetical order.
# Cross-cutting terms should go in the root cspell.json instead.
version: "0.2"
import:
  - ../../.vscode/cspell.json
words:
  - "bsuid"
  - "contoso"
  - "dgpg"
  - "dicom"
  - "dinclude"
  - "dskip"
  - "endedby"
  - "fhir"
  - "gcch"
  - "mqtt"
  - "osrolling"
  - "osscheduling"
  - "outofsync"
  - "resistry"
  - "rservice"
  - "updation"
